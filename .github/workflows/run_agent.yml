name: Run Agent

on:
  schedule:
    - cron: "0 9 * * 2"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      agent_skill:
        description: Nombre de la skill que se cargará desde skills/ (sin .md)
        required: false
        type: string
        default: "radar_innovacion"
      agent_prompt:
        description: Prompt para el agente; vacío para usar el prompt predeterminado
        required: false
        type: string
        default: ""

jobs:
  run-agent:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RADAR_SMTP_HOST: ${{ secrets.RADAR_SMTP_HOST }}
      RADAR_SMTP_PORT: ${{ secrets.RADAR_SMTP_PORT }}
      RADAR_SMTP_USER: ${{ secrets.RADAR_SMTP_USER }}
      RADAR_SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD }}
      RADAR_SMTP_FROM: ${{ secrets.RADAR_SMTP_FROM }}
      RADAR_SMTP_TO: ${{ secrets.RADAR_SMTP_TO }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scheduled radar
        if: github.event_name == 'schedule'
        env:
          AGENT_SKILL: radar_innovacion
        run: python main.py

      - name: Run agent manually
        if: github.event_name == 'workflow_dispatch'
        env:
          AGENT_SKILL: ${{ inputs.agent_skill }}
          AGENT_PROMPT: ${{ inputs.agent_prompt }}
        run: python main.py
