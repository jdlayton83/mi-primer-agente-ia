name: Run Agent

on:
  workflow_dispatch:
    inputs:
      agent_skill:
        description: Nombre de la skill que se cargará desde skills/ (sin .md)
        required: false
        type: string
        default: ""
      agent_prompt:
        description: Prompt para el agente; vacío para usar el prompt predeterminado
        required: false
        type: string
        default: ""

jobs:
  run-agent:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run agent
        env:
          AGENT_SKILL: ${{ inputs.agent_skill }}
          AGENT_PROMPT: ${{ inputs.agent_prompt }}
        run: python main.py
